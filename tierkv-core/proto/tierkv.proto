syntax = "proto3";
package tierkv;

// KV tensor payload shared across services
message KVTensor {
  uint64 token_idx  = 1;
  uint32 layer      = 2;
  bytes  data       = 3;   // raw f32 or bf16 bytes
  uint32 rows       = 4;
  uint32 cols       = 5;
  string dtype      = 6;   // "f32" | "bf16"
}

// ── Cold Vault ───────────────────────────────────────────────────────────────

message StoreRequest  { KVTensor kv = 1; }
message StoreResponse { bool ok     = 1; }

message PromoteRequest  { uint64 token_idx = 1; uint32 layer = 2; }

message BatchPromoteRequest {
  uint64          token_idx = 1;
  repeated uint32 layers    = 2;
}

message BatchPromoteResponse {
  repeated KVTensor tensors = 1;  // same order as request.layers; empty data = missing
}

service ColdVaultService {
  rpc Store        (StoreRequest)        returns (StoreResponse);
  rpc Promote      (PromoteRequest)      returns (KVTensor);
  rpc BatchPromote (BatchPromoteRequest) returns (BatchPromoteResponse);
}

// ── Recompute (inference node) ───────────────────────────────────────────────

message RecomputeRequest {
  uint64 token_idx = 1;
  uint32 layer     = 2;
}

service RecomputeService {
  rpc Recompute (RecomputeRequest) returns (KVTensor);
}

// ── vLLM Cold Vault (block-hash addressed) ──────────────────────────────────

message VllmBlockStoreRequest {
  string block_hash_hex = 1;   // composite hash hex-encoded
  string layer_type     = 2;   // "full_attention" | "sliding_window" | "ssm"
  bytes  payload        = 3;   // TurboQuant INT8 or raw BF16
  bool   is_quantized   = 4;
  uint32 num_tokens     = 5;   // actual tokens in block (≤ block_size)
}

message VllmBlockStoreResponse {
  string vault_key = 1;        // opaque key for BatchPromote
}

message VllmBatchPromoteRequest {
  repeated string vault_keys = 1;
}

message VllmBatchPromoteResponse {
  repeated VllmBlockData blocks = 1;
}

message VllmBlockData {
  string block_hash_hex = 1;
  bytes  payload        = 2;
  bool   is_quantized   = 3;
}

service VllmColdVaultService {
  rpc StoreBlock   (VllmBlockStoreRequest)   returns (VllmBlockStoreResponse);
  rpc BatchPromote (VllmBatchPromoteRequest)  returns (VllmBatchPromoteResponse);
}
