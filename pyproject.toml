[project]
name = "tierkv"
version = "0.1.0"
description = "3-tier distributed KV cache for LLM inference — preserve evicted KV across cluster nodes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["llm", "inference", "kv-cache", "distributed", "vllm", "exo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "tierkv-core",
    "grpcio>=1.64",
    "grpcio-tools>=1.64",
    "numpy>=1.26",
    "rich>=15.0.0",
]

[project.optional-dependencies]
exo = [
    "httpx>=0.27",
    "openai>=2.33.0",
]
vllm = [
    "vllm>=0.20.1",
]
all = [
    "tierkv[exo]",
    "tierkv[vllm]",
]

[project.urls]
Homepage = "https://github.com/tierkv/tierkv"
"Bug Tracker" = "https://github.com/tierkv/tierkv/issues"

[project.scripts]
tierkv = "tierkv.cli:main"

[project.entry-points."vllm.kv_connector"]
tierkv = "tierkv.connectors.vllm.connector:TierKVConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tierkv"]

[tool.uv.sources]
tierkv-core = { workspace = true }

[tool.uv.workspace]
members = ["tierkv-core"]

[dependency-groups]
dev = [
    "maturin>=1.13.1",
]
