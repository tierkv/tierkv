syntax = "proto3";
package hailey;

// KV tensor payload shared across services
message KVTensor {
  uint64 token_idx  = 1;
  uint32 layer      = 2;
  bytes  data       = 3;   // raw f32 or bf16 bytes
  uint32 rows       = 4;
  uint32 cols       = 5;
  string dtype      = 6;   // "f32" | "bf16"
}

// ── Cold Vault (Mac Air) ─────────────────────────────────────────────────────

message StoreRequest  { KVTensor kv = 1; }
message StoreResponse { bool ok     = 1; }

message PromoteRequest  { uint64 token_idx = 1; uint32 layer = 2; }

message BatchPromoteRequest {
  uint64          token_idx = 1;
  repeated uint32 layers    = 2;
}

message BatchPromoteResponse {
  repeated KVTensor tensors = 1;  // same order as request.layers; empty data = missing
}

service ColdVaultService {
  rpc Store        (StoreRequest)        returns (StoreResponse);
  rpc Promote      (PromoteRequest)      returns (KVTensor);
  rpc BatchPromote (BatchPromoteRequest) returns (BatchPromoteResponse);
}

// ── Recompute (DGX Spark) ────────────────────────────────────────────────────

message RecomputeRequest {
  uint64 token_idx = 1;
  uint32 layer     = 2;
}

service RecomputeService {
  rpc Recompute (RecomputeRequest) returns (KVTensor);
}
