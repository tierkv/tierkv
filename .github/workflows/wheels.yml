name: Build & Test Wheels

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── Python unit tests (no Rust needed) ────────────────────────────────────
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest grpcio numpy

      - name: Run connector tests
        run: pytest tierkv/connectors/vllm/tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ── Rust wheel builds ──────────────────────────────────────────────────────
  build-wheels:
    name: Wheel — ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # DGX Spark target — this is the critical one
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
          # x86_64 Linux (servers, cloud)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          # Apple Silicon (Mac Pro + Mac Air vault servers)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel (${{ matrix.target }})
        uses: PyO3/maturin-action@v1
        with:
          working-directory: tierkv-core
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: tierkv-core/dist/*.whl
          retention-days: 7

  # ── tierkv-core sdist (for PyPI source installs) ─────────────────────────
  build-core-sdist:
    name: tierkv-core sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tierkv-core sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: tierkv-core
          command: build
          args: --sdist --out dist

      - name: Upload core sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-sdist
          path: tierkv-core/dist/*.tar.gz
          retention-days: 7

  # ── Python sdist (tierkv package itself) ──────────────────────────────────
  build-sdist:
    name: Python sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          pip install hatchling
          python -m hatchling build --target sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  # ── Summary: print download URLs on every master push ─────────────────────
  summary:
    name: Wheel download links
    needs: [build-wheels, build-sdist, build-core-sdist]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List all artifacts
        run: |
          echo "## Built artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install on DGX (aarch64)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          LINUX_WHEEL=$(ls dist/*aarch64*.whl 2>/dev/null | head -1 | xargs basename)
          RUN_ID=${{ github.run_id }}
          REPO=${{ github.repository }}
          echo "# Download from GitHub Actions:" >> $GITHUB_STEP_SUMMARY
          echo "gh run download ${RUN_ID} -R ${REPO} -n wheels-linux-aarch64" >> $GITHUB_STEP_SUMMARY
          echo "uv pip install --force-reinstall ${LINUX_WHEEL}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Tag release: attach all wheels to GitHub Release ──────────────────────
  release:
    name: Publish to GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List release artifacts
        run: ls -lh dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **DGX / Linux aarch64:**
            ```bash
            gh release download ${{ github.ref_name }} -R ${{ github.repository }} --pattern '*aarch64*linux*.whl'
            uv pip install --force-reinstall tierkv_core-*aarch64*.whl
            uv pip install "tierkv[vllm] @ https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tierkv-*.tar.gz"
            ```

            **Mac Pro / Mac Air (Apple Silicon):**
            ```bash
            gh release download ${{ github.ref_name }} -R ${{ github.repository }} --pattern '*arm64*.whl'
            uv pip install --force-reinstall tierkv_core-*arm64*.whl
            ```

  # ── Publish tierkv-core wheels + sdist to PyPI ────────────────────────────
  publish-core:
    name: Publish tierkv-core to PyPI
    needs: [build-wheels, build-core-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: dist/

      - name: Publish tierkv-core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── Publish tierkv sdist to PyPI (after core is live) ─────────────────────
  publish-tierkv:
    name: Publish tierkv to PyPI
    needs: [build-sdist, publish-core]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish tierkv to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
